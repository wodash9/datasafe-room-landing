<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-label="2. Flujo de datos PCF / UX end-to-end">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.12"/></filter>
</defs>
<style>text{font-family:Inter,Arial,sans-serif} .small{font-size:11px;fill:#6b7280}</style>
<rect width="1000" height="510" fill="white"/>
<text x="500.0" y="28" text-anchor="middle" font-size="22" font-weight="800" fill="#111827">2. Flujo de datos PCF / UX end-to-end</text>
<text x="500.0" y="50" text-anchor="middle" font-size="12" font-weight="500" fill="#6b7280">De la sala al audit pack con exposición mínima</text>
<rect x="35" y="90" width="210" height="86" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="140.0" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">1 Crear sala</text>
<text x="140.0" y="151" text-anchor="middle" font-size="11" fill="#6b7280">Finalidad, alcance, owner,</text>
<text x="140.0" y="164" text-anchor="middle" font-size="11" fill="#6b7280">retención</text>
<line x1="245" y1="133.0" x2="280" y2="133.0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="280" y="90" width="210" height="86" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
<text x="385.0" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">2 Invitar partes</text>
<text x="385.0" y="151" text-anchor="middle" font-size="11" fill="#6b7280">Proveedor, cliente, auditor;</text>
<text x="385.0" y="164" text-anchor="middle" font-size="11" fill="#6b7280">deny by default</text>
<line x1="490" y1="133.0" x2="525" y2="133.0" stroke="#0891b2" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="525" y="90" width="210" height="86" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<text x="630.0" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">3 Solicitar campos</text>
<text x="630.0" y="151" text-anchor="middle" font-size="11" fill="#6b7280">Plantilla PCF: unidad,</text>
<text x="630.0" y="164" text-anchor="middle" font-size="11" fill="#6b7280">periodo, factores, evidencias</text>
<line x1="735" y1="133.0" x2="770" y2="133.0" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="770" y="90" width="210" height="86" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
<text x="875.0" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">4 Subir evidencia</text>
<text x="875.0" y="164" text-anchor="middle" font-size="11" fill="#6b7280">CSV/XLSX/PDF/ZIP + metadatos</text>
<path d="M 875.0 176 C 875.0 220, 70 220, 70 250" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="250" width="210" height="86" rx="12" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
<text x="140.0" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">5 Clasificar sensibilidad</text>
<text x="140.0" y="311" text-anchor="middle" font-size="11" fill="#6b7280">Owner, secreto, personal data,</text>
<text x="140.0" y="324" text-anchor="middle" font-size="11" fill="#6b7280">output permitido</text>
<line x1="245" y1="293.0" x2="280" y2="293.0" stroke="#f97316" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="280" y="250" width="210" height="86" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<text x="385.0" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">6 Preview por rol</text>
<text x="385.0" y="298" text-anchor="middle" font-size="11" fill="#6b7280">Qué verá</text>
<text x="385.0" y="311" text-anchor="middle" font-size="11" fill="#6b7280">cliente/proveedor/auditor</text>
<text x="385.0" y="324" text-anchor="middle" font-size="11" fill="#6b7280">antes de aprobar</text>
<line x1="490" y1="293.0" x2="525" y2="293.0" stroke="#0f766e" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="525" y="250" width="210" height="86" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
<text x="630.0" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">7 Aprobar output</text>
<text x="630.0" y="311" text-anchor="middle" font-size="11" fill="#6b7280">Approver + policy checks +</text>
<text x="630.0" y="324" text-anchor="middle" font-size="11" fill="#6b7280">comentarios</text>
<line x1="735" y1="293.0" x2="770" y2="293.0" stroke="#d97706" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="770" y="250" width="210" height="86" rx="12" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
<text x="875.0" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">8 Export + audit pack</text>
<text x="875.0" y="311" text-anchor="middle" font-size="11" fill="#6b7280">PDF/CSV/ZIP +</text>
<text x="875.0" y="324" text-anchor="middle" font-size="11" fill="#6b7280">hashes/log/versiones</text>
<rect x="35" y="405" width="930" height="70" rx="12" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
<text x="500.0" y="427" text-anchor="middle" font-size="15" font-weight="700" fill="#111827">Carril de gobierno</text>
<text x="500.0" y="463" text-anchor="middle" font-size="11" fill="#6b7280">Políticas + acuerdos + grants + audit log acompañan cada paso; no hay salida sin revisión cuando sensibilidad &gt; baja.</text>
<line x1="140" y1="250" x2="140" y2="405" stroke="#111827" stroke-width="1" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<line x1="385" y1="250" x2="385" y2="405" stroke="#111827" stroke-width="1" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<line x1="630" y1="250" x2="630" y2="405" stroke="#111827" stroke-width="1" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<line x1="875" y1="250" x2="875" y2="405" stroke="#111827" stroke-width="1" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
</svg>