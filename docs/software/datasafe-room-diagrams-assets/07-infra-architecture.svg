<text x="152.5" y="515" text-anchor="middle" font-size="10" fill="#6b7280">Export CSV/XLSX/PDF aprobado;</text>
<text x="152.5" y="528" text-anchor="middle" font-size="10" fill="#6b7280">sin OT directo</text>
<rect x="320" y="485" width="260" height="55" rx="12" fill="#e0f2fe" stroke="#0891b2" stroke-width="2"/>
<text x="450.0" y="507" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Identidad</text>
<text x="450.0" y="528" text-anchor="middle" font-size="10" fill="#6b7280">OIDC/SAML + MFA + dominios permitidos</text>
<rect x="640" y="485" width="270" height="55" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="775.0" y="507" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Observabilidad</text>
<text x="775.0" y="515" text-anchor="middle" font-size="10" fill="#6b7280">Logs, métricas, alertas SIEM, backup</text>
<text x="775.0" y="528" text-anchor="middle" font-size="10" fill="#6b7280">restore drill</text>
<line x1="152" y1="485" x2="152" y2="415" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<line x1="450" y1="485" x2="450" y2="395" stroke="#0891b2" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<line x1="775" y1="485" x2="775" y2="440" stroke="#d97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
