<text x="175.0" y="202" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">WAF / CDN</text>
<text x="175.0" y="220" text-anchor="middle" font-size="10" fill="#6b7280">TLS, headers, DDoS</text>
<text x="175.0" y="233" text-anchor="middle" font-size="10" fill="#6b7280">básico</text>
