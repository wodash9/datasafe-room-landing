<text x="802.5" y="267" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Object Storage</text>
<text x="802.5" y="288" text-anchor="middle" font-size="10" fill="#6b7280">encryption + lifecycle</text>
<rect x="705" y="315" width="195" height="55" rx="12" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
