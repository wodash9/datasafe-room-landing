<text x="485.0" y="197" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">API / Services</text>
<text x="485.0" y="223" text-anchor="middle" font-size="10" fill="#6b7280">Room, Catalog, Workflow</text>
