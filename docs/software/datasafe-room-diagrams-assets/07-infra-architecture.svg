</defs>
<style>text{font-family:Inter,Arial,sans-serif} .small{font-size:11px;fill:#6b7280}</style>
<rect width="1010" height="575" fill="white"/>
<text x="505.0" y="28" text-anchor="middle" font-size="22" font-weight="800" fill="#111827">7. Arquitectura de infraestructura</text>
<text x="505.0" y="50" text-anchor="middle" font-size="12" font-weight="500" fill="#6b7280">Diseño seguro por defecto, sin tocar OT/SCADA en MVP</text>
<rect x="30" y="75" width="955" height="390" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="65" y="100" text-anchor="start" font-size="13" font-weight="800" fill="#111827">Cloud/VPC DataSafe Room</text>
