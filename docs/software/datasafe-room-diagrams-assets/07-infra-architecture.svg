<text x="485.0" y="303" text-anchor="middle" font-size="10" fill="#6b7280">RBAC/ABAC + export gates</text>
<rect x="385" y="335" width="200" height="60" rx="12" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
<text x="485.0" y="357" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Background Workers</text>
<text x="485.0" y="370" text-anchor="middle" font-size="10" fill="#6b7280">hash, PDF/ZIP, retention</text>
<text x="485.0" y="383" text-anchor="middle" font-size="10" fill="#6b7280">jobs</text>
<rect x="670" y="130" width="280" height="285" rx="14" fill="#fefce8" stroke="#fde68a"/>
<text x="695" y="155" text-anchor="start" font-size="12" font-weight="800" fill="#111827">Zona datos protegida</text>
